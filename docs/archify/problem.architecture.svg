<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Problem architecture: why HTTPS-first probing fails on captive portals">
<rect width="900" height="300" fill="#ffffff"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#0969da" stroke-width="1.5"/></marker></defs>
<text x="20" y="24" font-size="15" font-weight="bold" fill="#111">1 · Problem — why HTTPS-first fails (Changi #ChangiWiFi)</text>
<rect x="20" y="110" width="150" height="70" rx="10" fill="#fff" stroke="#0969da" stroke-width="1.5"/><text x="95" y="138" text-anchor="middle" font-size="13" fill="#111">Traveler laptop</text><text x="95" y="156" text-anchor="middle" font-size="11" fill="#57606a">#ChangiWiFi T2</text>
<rect x="230" y="110" width="170" height="70" rx="10" fill="#fff8e1" stroke="#9a6700" stroke-width="1.5"/><text x="315" y="138" text-anchor="middle" font-size="13" fill="#111">Wi-Fi gateway</text><text x="315" y="156" text-anchor="middle" font-size="11" fill="#57606a">hijacks :80 / :443</text>
<rect x="460" y="30" width="200" height="70" rx="10" fill="#e6ffec" stroke="#1a7f37" stroke-width="1.5"/><text x="560" y="56" text-anchor="middle" font-size="13" fill="#111">http://neverssl.com</text><text x="560" y="74" text-anchor="middle" font-size="11" fill="#1a7f37">302 → portal (signal)</text>
<rect x="460" y="190" width="200" height="70" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="560" y="216" text-anchor="middle" font-size="13" fill="#111">https://… (don&#8217;t)</text><text x="560" y="234" text-anchor="middle" font-size="11" fill="#cf222e">cert mismatch / HSTS</text>
<rect x="720" y="110" width="160" height="70" rx="10" fill="#fff" stroke="#0969da" stroke-width="1.5"/><text x="800" y="138" text-anchor="middle" font-size="13" fill="#111">Portal + TOS</text><text x="800" y="156" text-anchor="middle" font-size="11" fill="#57606a">form · csrf · accept</text>
<line x1="170" y1="135" x2="228" y2="135" stroke="#0969da" stroke-width="1.5" marker-end="url(#a)"/><line x1="315" y1="110" x2="500" y2="65" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#a)"/><line x1="315" y1="180" x2="500" y2="225" stroke="#cf222e" stroke-width="1.5" marker-end="url(#a)"/><line x1="660" y1="65" x2="740" y2="120" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#a)"/>
<text x="20" y="285" font-size="11" fill="#57606a">Gateway serves its own cert → ERR_CERT_COMMON_NAME_INVALID. Plain-HTTP 302 + Location is the only trustworthy signal.</text>
</svg>
